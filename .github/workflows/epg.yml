name: TV guide

on:
  schedule:
    - cron: '20 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: epg

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pick sites and channels
        run: node scripts/epg-plan.mjs

      - name: Get the guide grabber
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git grabber
          cd grabber && npm install --no-audit --no-fund

      - name: Grab guides (a site that fails is skipped)
        run: |
          mkdir -p epg-out
          while read -r site; do
            [ -z "$site" ] && continue
            echo "::group::$site"
            (cd grabber && timeout 12m npm run grab --silent -- --channels="../epg-work/$site.channels.xml" --output="../epg-out/$site.xml" --days=2 --maxConnections=6 --timeout=20000) || echo "skipped $site"
            echo "::endgroup::"
          done < epg-work/sites.txt

      - name: Merge into public/epg.json
        run: node scripts/epg-merge.mjs

      - name: Commit
        run: |
          git config user.name "comvie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/epg.json
          git diff --cached --quiet || (git commit -m "Update TV guide" && git push)
